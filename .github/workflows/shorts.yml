name: GTA5 Shorts Manager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check YouTube secrets
        run: |
          if [ -z "${{ secrets.YOUTUBE_CLIENT_ID }}" ]; then echo "Missing CLIENT_ID"; exit 1; fi
          if [ -z "${{ secrets.YOUTUBE_CLIENT_SECRET }}" ]; then echo "Missing CLIENT_SECRET"; exit 1; fi
          echo "Setup OK"